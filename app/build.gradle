plugins { id 'com.android.application' }
android {
    namespace 'com.cyberhub.manager'
    compileSdk 34
    buildToolsVersion '35.0.0'
    signingConfigs { development { storeFile file('src/main/assets/development-signing.p12'); storePassword 'cyberhub-development'; keyAlias 'cyberhub-dev'; keyPassword 'cyberhub-development'; storeType 'PKCS12' } }
    buildTypes { debug { signingConfig signingConfigs.development } }
    defaultConfig { applicationId 'com.cyberhub.manager'; minSdk 26; targetSdk 34; versionCode 12; versionName '0.1.11' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_11; targetCompatibility JavaVersion.VERSION_11 }
    packaging { resources { excludes += ['META-INF/DEPENDENCIES','META-INF/INDEX.LIST','META-INF/*.SF','META-INF/*.RSA','META-INF/*.DSA','META-INF/versions/**','META-INF/LICENSE*','META-INF/NOTICE*','okhttp3/internal/publicsuffix/NOTICE']; pickFirsts += [] } }
}
dependencies {
    // 本地 app/libs 携带全部运行时类（jsch、okhttp/okio、jcifs-ng、shizuku api/provider、
    // bouncycastle、termux 等）。不要再声明它们的远程坐标，否则会重复打包同一份类。
    // ShizukuProvider 已在 AndroidManifest.xml 直接声明，无需远程 AAR 的 manifest 合并。
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    // terminal-view 的 jar 只在 tools/build.py 的桌面 classpath（tools/termux/libs）里，
    // 没有放进 app/libs，所以 Gradle 构建仍需远程 AAR 来提供 com.termux.view.TerminalView 类。
    implementation('com.github.termux.termux-app:terminal-view:v0.118.3') {
        exclude group: 'com.github.termux.termux-app', module: 'terminal-emulator'
    }
}
